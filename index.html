<body>
<header><div class="wrap">
  <div class="top">
    <div><small>두산 디지털이노베이션BU 골프동호회</small><h1>PGA 투어</h1></div>
    <div class="me" id="meBox"></div>
  </div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <section id="s-login"></section>
  <section id="s-event"></section>
  <section id="s-history"></section>
  <section id="s-members"></section>
  <section id="s-draw"></section>
</main>
<div id="toast"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const SESSION_MS = 8 * 60 * 60 * 1000; // 8시간
let me = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("pga:me") || "null");
    if (v && v.at && Date.now() - v.at > SESSION_MS) { localStorage.removeItem("pga:me"); return null; }
    return v;
  } catch { return null; }
})();
let members = [], events = [], rsvps = [], selectedId = null, tab = "event", creating = false;
let naverMap = null, naverMarker = null;
let draws = []; // {event_id, results:[{name,prize}]}
let layouts = []; // {event_id, groups:[[name,...],...]} 관리자 수동 조 편성
let ge = null;    // 조 편성 편집 중인 초안 {evId, groups:[[...]], un:[...]}
let dr = { phase:"setup", prizes:["1등 상품","2등 상품","3등 상품"], excluded:[], extra:[], round:0, winners:[], spin:"" };

const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); };
const fmtDate = (iso) => { const d = new Date(iso + "T00:00:00"); return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`; };
const monthOf = (iso) => `${new Date(iso + "T00:00:00").getMonth()+1}월`;
const isAdmin = () => !!me?.is_admin;

/* ---------- 데이터 ---------- */
// 관리자 먼저, 그다음 가나다순
const byName = (a, b) => a.localeCompare(b, "ko");
const sortMembers = (list) => [...list].sort((a, b) => (b.is_admin - a.is_admin) || byName(a.name, b.name));
const memberRank = (n) => { const i = members.findIndex((m) => m.name === n); return i < 0 ? 1e9 : i; };
const sortNames = (names) => [...names].sort((a, b) => (memberRank(a) - memberRank(b)) || byName(a, b));
async function loadAll() {
  const [m, e, r, d, g] = await Promise.all([
    sb.from("members").select("name,position,is_admin,sort_order").order("sort_order"),
    sb.from("events").select("*").order("event_date", { ascending: false }),
    sb.from("rsvps").select("*"),
    sb.from("draws").select("*"),
    sb.from("group_layouts").select("*"),
  ]);
  if (m.error || e.error || r.error) { toast("불러오기 실패: " + (m.error || e.error || r.error).message); return; }
  members = sortMembers(m.data); events = e.data; rsvps = r.data; draws = d.data || []; layouts = g.data || [];
  if (!events.find((x) => x.id === selectedId)) selectedId = events[0]?.id ?? null;
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message.replace(/^.*?: /, ""));
  return data;
}
const auth = () => ({ p_name: me.name, p_pin: me.pin });

/* ---------- 렌더 ---------- */
function render() {
  $("meBox").innerHTML = me ? `<div>${esc(me.name)}${isAdmin() ? '<span class="badge">관리자</span>' : ""}</div><button onclick="logout()">다른 이름으로 접속</button>` : "";
  const tabs = me ? (isAdmin() ? [["event","이번 모임"],["history","지난 모임"],["draw","상품 추첨"],["members","회원 관리"]] : [["event","이번 모임"],["history","지난 모임"]]) : [];
  $("nav").innerHTML = tabs.map(([k,l]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  ["login","event","history","members","draw"].forEach((k) => $("s-"+k).classList.toggle("on", me ? tab===k : k==="login"));
  if (!me) renderLogin(); else if (tab==="event") renderEvent(); else if (tab==="history") renderHistory(); else if (tab==="draw") renderDraw(); else renderMembers();
}
function go(k) { tab = k; creating = false; ge = null; render(); }
function logout() { me = null; localStorage.removeItem("pga:me"); tab = "event"; render(); }

function renderLogin() {
  $("s-login").innerHTML = `
  <div style="max-width:380px;margin:24px auto">
    <h2>접속</h2><p class="sub">이름을 선택하고 휴대폰 번호 뒷자리 4자리를 입력하세요. 이 기기에 8시간 동안 기억됩니다.</p>
    <div class="grid">
      <div><label>이름</label><select class="inp" id="lgName"><option value="">선택</option>${members.map((m)=>`<option value="${esc(m.name)}">${esc(m.name)}${m.is_admin?" (관리자)":""}</option>`).join("")}</select></div>
      <div><label>휴대폰 뒷자리 4자리</label><input class="inp" id="lgPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="err" id="lgErr"></div>
      <button class="btn p full" onclick="doLogin()">들어가기</button>
    </div>
  </div>`;
  $("lgPin").addEventListener("keydown", (e) => e.key==="Enter" && doLogin());
}
async function doLogin() {
  const name = $("lgName").value, pin = $("lgPin").value.replace(/\D/g,"");
  if (!name) return $("lgErr").textContent = "이름을 선택해 주세요";
  if (pin.length !== 4) return $("lgErr").textContent = "뒷자리 4자리를 입력해 주세요";
  try {
    const r = await rpc("login", { p_name: name, p_pin: pin });
    me = { name: r.name, pin, is_admin: r.is_admin, at: Date.now() };
    localStorage.setItem("pga:me", JSON.stringify(me));
    render();
  } catch (e) { $("lgErr").textContent = e.message; }
}

function groupsOf(evId) {
  const yes = rsvps.filter((r) => r.event_id===evId && r.status==="yes").sort((a,b)=>(a.leave_time||"").localeCompare(b.leave_time||""));
  const g = []; for (let i=0;i<yes.length;i+=GROUP_SIZE) g.push(yes.slice(i,i+GROUP_SIZE)); return g;
}
function announcement(ev) {
  return `안녕하세요, PGA 투어 동호회 입니다.

이번 달 동호회 활동은 ${fmtDate(ev.event_date)}에 진행합니다.

참석 여부는 메일 회신 대신 아래 동호회 페이지에서 직접 등록해 주세요.
▶ ${SITE_URL}
  1) 이름 선택 → 휴대폰 뒷자리 4자리 입력
  2) 참석/불참 선택 + 퇴근 시간 입력 → 등록
  (퇴근 시간은 조 편성에 참고합니다. 조 편성 결과도 같은 페이지에서 확인됩니다.)

장소 : ${ev.place} (${ev.address})
${ev.link}

/* ---------- 조 편성 (자동 / 관리자 수동 · 드래그앤드랍) ---------- */
const leaveOf = (evId, n) => rsvps.find((r) => r.event_id===evId && r.name===n)?.leave_time || "";
const yesNames = (evId) => rsvps.filter((r) => r.event_id===evId && r.status==="yes").sort((a,b)=>(a.leave_time||"").localeCompare(b.leave_time||"")).map((r) => r.name);
const autoGroups = (evId) => groupsOf(evId).map((g) => g.map((r) => r.name));
// 실제로 보여줄 조: 저장된 수동 편성이 있으면 그것(불참·취소자 제외, 새 참석자는 '미배정'), 없으면 자동
function effGroups(evId) {
  const lay = layouts.find((l) => l.event_id===evId);
  if (!lay || !Array.isArray(lay.groups) || !lay.groups.length) return { manual:false, groups:autoGroups(evId), un:[] };
  const yes = new Set(yesNames(evId)), used = new Set();
  const groups = lay.groups.map((g) => (g||[]).filter((n) => yes.has(n) && !used.has(n) && used.add(n)));
  return { manual:true, groups, un:sortNames([...yes].filter((n) => !used.has(n))) };
}
const timeRange = (evId, g) => { const t = g.map((n) => leaveOf(evId, n)).filter(Boolean).sort(); return t.length ? (t[0]===t[t.length-1] ? `${t[0]} 퇴근` : `${t[0]} ~ ${t[t.length-1]} 퇴근`) : ""; };

function renderGroups() {
  const box = $("grpBox"); if (!box) return;
  const ev = events.find((e) => e.id===selectedId); if (!ev) return;
  if (ge && !isAdmin()) ge = null;
  if (ge) return renderGroupEditor(ev);
  const { manual, groups, un } = effGroups(ev.id);
  const tag = manual ? `<span class="gtag man">관리자 편성</span>` : `<span class="gtag">퇴근시간순 ${GROUP_SIZE}명씩 자동</span>`;
  const editBtn = isAdmin() && yesNames(ev.id).length ? `<button class="btn" style="padding:6px 12px" onclick="startEditGroups()">✋ 조 편집</button>` : "";
  const card = (g, i) => `<div class="group"><div class="h"><span>${i+1}조</span><span>${esc(timeRange(ev.id, g))}</span></div><ul>
    ${g.map((n)=>`<li><span>${esc(n)}</span><span style="opacity:.7">${esc(leaveOf(ev.id, n))} 퇴근</span></li>`).join("")}
    ${Array.from({length:Math.max(0, GROUP_SIZE-g.length)}).map(()=>`<li class="empty">빈 자리</li>`).join("")}</ul></div>`;
  box.innerHTML = `<div class="sec-h"><h3>조 편성 ${tag}</h3>${editBtn}</div>
  ${groups.length || un.length ? `<div class="groups">${groups.map(card).join("")}
    ${un.length ? `<div class="group unas"><div class="h"><span>미배정 ${un.length}</span><span>조 편성 후 새로 참석 등록</span></div><ul>${un.map((n)=>`<li><span>${esc(n)}</span><span style="opacity:.7">${esc(leaveOf(ev.id, n))} 퇴근</span></li>`).join("")}</ul></div>` : ""}</div>`
   : `<div class="empty">아직 참석자가 없어요. 위에서 참석을 등록하면 조가 자동으로 만들어집니다.</div>`}`;
}

function renderGroupEditor(ev) {
  const chip = (n) => `<li class="dchip" data-n="${esc(n)}"><span>${esc(n)}</span><span style="opacity:.6;font-size:13px">${esc(leaveOf(ev.id, n))}</span></li>`;

function startEditGroups() {

async function saveGroups() {

async function resetGroupsToAuto() {

}
function moveName(name, toKey, beforeName) {
  if (beforeName === name) return;
  ge.groups = ge.groups.map((g) => g.filter((n) => n !== name)); ge.un = ge.un.filter((n) => n !== name);
  const list = toKey === "un" ? ge.un : ge.groups[+toKey];
  const at = beforeName ? list.indexOf(beforeName) : -1;
  at >= 0 ? list.splice(at, 0, name) : list.push(name);
  if (toKey === "un" && !beforeName) ge.un = sortNames(ge.un);
}

async function moveAttendance(name, to) {
  const evId = selectedId, cur = rsvps.find((r)=>r.event_id===evId && r.name===name);
  const from = cur ? cur.status : "none"; if (from === to) return;
  const leave = cur?.leave_time || "17:30";
  // 화면 먼저 바꾸고 서버에 반영 (실패하면 되돌림)
  rsvps = rsvps.filter((r)=>!(r.event_id===evId && r.name===name));
  if (to !== "none") rsvps.push({ event_id: evId, name, status: to, leave_time: to==="yes" ? leave : null });
  if (ge && ge.evId === evId) { ge.groups = ge.groups.map((g)=>g.filter((n)=>n!==name)); ge.un = ge.un.filter((n)=>n!==name); if (to==="yes") ge.un = sortNames([...ge.un, name]); }
  render();
  try {
    if (to === "none") await rpc("admin_delete_rsvp", { ...auth(), p_event_id: evId, p_target: name });
    else await rpc("admin_upsert_rsvp", { ...auth(), p_target: name, p_event_id: evId, p_status: to, p_leave: to==="yes" ? leave : null });
    toast(`${name} → ${{yes:"참석",no:"불참",none:"미회신"}[to]}${to==="yes" && !cur?.leave_time ? " (퇴근 17:30, 위 '대신 등록'에서 수정 가능)" : ""}`);
  } catch (e) { toast(e.message); }
  await loadAll(); render();
}

// 마우스·터치 공통 드래그 (Pointer Events — 외부 라이브러리 없음)
let drag = null, autoScroll = null;
function dzAt(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return {};
  return { zone: el.closest(".dz"), chip: el.closest(".dchip") };
}
function clearMarks() { document.querySelectorAll(".dz.over").forEach((z)=>z.classList.remove("over")); document.querySelectorAll(".dchip.before").forEach((c)=>c.classList.remove("before")); }
document.addEventListener("pointerdown", (e) => {
  const c = e.target.closest(".dchip"); if (!c || (e.button && e.button !== 0)) return;
  const kind = c.closest(".dz")?.dataset.kind || "grp";
  if (!isAdmin() || (kind === "grp" && !ge)) return; // 끌기는 관리자만
  e.preventDefault();
  try { c.releasePointerCapture?.(e.pointerId); } catch {}
  drag = { kind, name:c.dataset.n, src:c, id:e.pointerId, x0:e.clientX, y0:e.clientY, ghost:null, offX:0, offY:0 };
});
document.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 5) return;
    const r = drag.src.getBoundingClientRect();
    drag.ghost = drag.src.cloneNode(true); drag.ghost.classList.add("ghost-chip"); drag.ghost.style.width = r.width + "px";
    drag.offX = drag.x0 - r.left; drag.offY = drag.y0 - r.top;
    document.body.appendChild(drag.ghost); drag.src.classList.add("dragging");
    if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.offX) + "px"; drag.ghost.style.top = (e.clientY - drag.offY) + "px";
  clearMarks();
  const { zone, chip } = dzAt(e.clientX, e.clientY);
  if (zone && (zone.dataset.kind || "grp") === drag.kind) zone.classList.add("over");
  if (chip && chip !== drag.src) chip.classList.add("before");
  // 화면 위/아래 가장자리에서 자동 스크롤
  const edge = 70, h = window.innerHeight; clearInterval(autoScroll); autoScroll = null;
  if (e.clientY < edge) autoScroll = setInterval(() => window.scrollBy(0, -12), 16);
  else if (e.clientY > h - edge) autoScroll = setInterval(() => window.scrollBy(0, 12), 16);
}, { passive:false });
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  clearInterval(autoScroll); autoScroll = null;
  const d = drag; drag = null; clearMarks();
  if (!d.ghost) return;
  d.ghost.remove(); d.src.classList.remove("dragging");
  if (cancel) return;
  const { zone, chip } = dzAt(e.clientX, e.clientY);
  if (!zone || (zone.dataset.kind || "grp") !== d.kind) return;
  if (d.kind === "att") return moveAttendance(d.name, zone.dataset.g);
  moveName(d.name, zone.dataset.g, chip && chip.dataset.n !== d.name ? chip.dataset.n : null);
  renderGroups();
}
document.addEventListener("pointerup", (e) => endDrag(e, false));
document.addEventListener("pointercancel", (e) => endDrag(e, true));
function setStatus(s) { window._status = s; $("rLeave").disabled = s==="no"; document.querySelectorAll(".toggle button").forEach((b)=>b.classList.toggle("on", b.classList.contains(s))); }

}
function copyAnn() { copy(announcement(events.find((e)=>e.id===selectedId)), "안내 메일 문구를 복사했어요"); }
function copyRemind() { const ev = events.find((e)=>e.id===selectedId); const p = members.map((m)=>m.name).filter((n)=>!rsvps.some((r)=>r.event_id===ev.id && r.name===n)); copy(`아직 참석 등록 안 하신 분: ${p.join(", ")}\n${SITE_URL} 에서 참석 여부와 퇴근 시간 등록 부탁드립니다!`, "리마인드 문구를 복사했어요"); }

function renderHistory() {
  $("s-history").innerHTML = events.length ? `<ul class="hist" style="padding:0;margin:0">${events.map((e)=>{ const c = rsvps.filter((r)=>r.event_id===e.id && r.status==="yes").length;
    return `<li><a onclick="selectedId=${e.id};go('event')"><b>${fmtDate(e.event_date)}</b><small>${esc(e.place)} · 참석 ${c}명 · ${(()=>{const x=effGroups(e.id);return x.groups.filter(g=>g.length).length;})()}개 조</small></a>${isAdmin()?`<button class="btn" onclick="delEvent(${e.id})">삭제</button>`:""}</li>`; }).join("")}</ul>`
    : `<div class="empty">아직 만든 모임이 없어요.</div>`;
}
async function delEvent(id) { if (!confirm("이 모임을 삭제할까요? 참석 기록도 함께 지워집니다.")) return; try { await rpc("admin_delete_event", { ...auth(), p_event_id: id }); await loadAll(); render(); } catch (e) { toast(e.message); } }

function renderMembers() {
  $("s-members").innerHTML = `
  <h2>회원 ${members.length}명</h2><p class="sub">각 회원의 휴대폰 뒷자리 4자리가 접속 비밀번호입니다. 보안상 화면에는 표시되지 않고, 새 번호를 넣고 저장하면 바뀝니다.</p>
  <div class="grid" style="grid-template-columns:1fr 90px 100px auto;margin-bottom:18px">
    <input class="inp" id="mName" placeholder="이름"><input class="inp" id="mPos" placeholder="직위"><input class="inp" id="mPin" inputmode="numeric" maxlength="4" placeholder="뒷자리 4"><button class="btn p" onclick="addMember()">추가</button>
  </div>
  <ul class="mlist card" style="padding:0">${members.map((m)=>`<li>
    <span class="n">${esc(m.name)} <span style="opacity:.6;font-weight:400">${esc(m.position||"")}</span>${m.is_admin?'<span class="badge" style="background:var(--green);color:#fff">관리자</span>':""}</span>
    <input class="inp short" inputmode="numeric" maxlength="4" placeholder="새 뒷자리" id="pin-${esc(m.name)}">
    <button class="btn" onclick="savePin('${esc(m.name)}','${esc(m.position||"")}',${m.is_admin})">저장</button>
    ${m.name!==me.name?`<button class="x" onclick="delMember('${esc(m.name)}')">×</button>`:""}
  </li>`).join("")}</ul>`;
}
async function addMember() {
  const n = $("mName").value.trim(), p = $("mPin").value.replace(/\D/g,"");
  if (!n) return toast("이름을 입력해 주세요"); if (p.length!==4) return toast("뒷자리 4자리를 입력해 주세요");
  try { await rpc("admin_upsert_member", { ...auth(), p_target: n, p_position: $("mPos").value.trim(), p_target_pin: p, p_is_admin: false }); toast(`${n} 등록`); await loadAll(); render(); } catch (e) { toast(e.message); }
}
async function savePin(n, pos, adm) {
  const p = $("pin-"+n).value.replace(/\D/g,""); if (p.length!==4) return toast("뒷자리 4자리를 입력해 주세요");
  try { await rpc("admin_upsert_member", { ...auth(), p_target: n, p_position: pos, p_target_pin: p, p_is_admin: adm }); if (n===me.name) { me = { ...me, pin: p }; localStorage.setItem("pga:me", JSON.stringify(me)); } toast(`${n} 뒷자리 변경`); } catch (e) { toast(e.message); }
}
async function delMember(n) { if (!confirm(`${n}님을 회원에서 삭제할까요?`)) return; try { await rpc("admin_delete_member", { ...auth(), p_target: n }); await loadAll(); render(); } catch (e) { toast(e.message); } }

/* ---------- 상품 추첨 (관리자) ---------- */
const medal = (i) => ["🏆","🥈","🥉"][i] || "🎖️";
const drawFor = (evId) => draws.find((d) => d.event_id === evId);
function drawPool() {
  const ev = events.find((e) => e.id===selectedId); if (!ev) return [];
  const yes = rsvps.filter((r) => r.event_id===ev.id && r.status==="yes").map((r) => r.name);
  return [...yes, ...dr.extra].filter((n) => !dr.excluded.includes(n));
}
function renderDraw() {
  const ev = events.find((e) => e.id===selectedId);
  const box = $("s-draw");
  if (!ev) { box.innerHTML = `<div class="empty">먼저 모임을 만들어 주세요. 추첨은 이번 모임 참석자를 대상으로 합니다.</div>`; return; }
  const pool = drawPool(), yes = rsvps.filter((r) => r.event_id===ev.id && r.status==="yes").map((r) => r.name);
  const saved = drawFor(ev.id);
  let body = "";
  if (dr.phase === "setup") {
    const can = pool.length >= dr.prizes.length && dr.prizes.length >= 1;
    body = `
    <div class="box"><h3><span>🏌️ 참가자 ${pool.length}명 <small style="font-weight:400;opacity:.7">(${fmtDate(ev.event_date)} 참석자 자동)</small></span></h3>
      <div class="chips">${[...yes, ...dr.extra].map((n) => `<span class="chip ${dr.excluded.includes(n)?"off":""}" onclick="drToggle('${esc(n)}')">${esc(n)}</span>`).join("") || '<span style="opacity:.6">참석 등록자가 아직 없어요</span>'}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="drExtra" placeholder="참석자 외 추가 (이름)" style="padding-left:12px"><button class="ghost" style="width:auto;margin:0;padding:8px 14px" onclick="drAddExtra()">추가</button></div>
      <div style="font-size:12px;opacity:.6;margin-top:6px">이름을 누르면 제외/포함이 바뀝니다.</div></div>
    <div class="box"><h3><span>🎁 상품 ${dr.prizes.length}개</span><button class="ghost" style="width:auto;margin:0;padding:6px 12px" onclick="drAddPrize()">+ 추가</button></h3>
      ${dr.prizes.map((p,i) => `<div class="prow"><span class="medal">${medal(i)}</span><input value="${esc(p)}" oninput="dr.prizes[${i}]=this.value" placeholder="${i+1}등 상품">${dr.prizes.length>1?`<button class="x" onclick="drRemovePrize(${i})">×</button>`:""}</div>`).join("")}</div>
    ${!can ? `<div style="margin-top:12px;color:#fca5a5;font-size:14px;text-align:center">참가자 수(${pool.length})가 상품 수(${dr.prizes.length}) 이상이어야 해요</div>` : ""}
    <button class="gold" ${can?"":"disabled"} onclick="drBegin()">🎲 추첨 시작</button>
    ${saved ? `<div class="box" style="margin-top:16px"><h3>지난 추첨 결과 (저장됨)</h3><div class="chips">${saved.results.map((w,i)=>`<span class="chip won">${medal(i)} ${esc(w.name)} · ${esc(w.prize)}</span>`).join("")}</div></div>` : ""}`;
  } else if (dr.phase === "finished") {
    body = `<div style="text-align:center;margin-top:10px"><div style="font-size:44px">🏆</div><div style="color:#fcd34d;font-size:22px;font-weight:800">최종 당첨자</div><div class="sub">축하합니다! 🎊</div></div>
    ${dr.winners.map((w,i) => `<div class="wcard ${["","s","b"][i]??"o"}" style="animation-delay:${i*.12}s"><div class="m">${medal(i)}</div><div><small>${esc(w.prize)}</small><b>${esc(w.name)}</b></div></div>`).join("")}
    <button class="gold" onclick="drSave()">💾 결과 저장 (회원들에게 공개)</button>
    <button class="ghost" onclick="drReset()">🔄 처음으로</button>`;
  } else {
    const remaining = pool.filter((n) => !dr.winners.some((w) => w.name===n));
    body = `<div class="bar">${dr.prizes.map((_,i)=>`<i class="${i<dr.round?"done":i===dr.round?"cur":""}"></i>`).join("")}</div>
    <div class="stage"><div class="top"><span>${medal(dr.round)}</span><span class="rank">${dr.round+1}등</span></div>
      <div class="prize">🎁 ${esc(dr.prizes[dr.round])}</div>
      <div class="name ${dr.phase}" id="drName">${dr.phase==="ready"?'<span style="font-size:15px;opacity:.7;font-weight:400">버튼을 눌러 추첨하세요</span>':dr.phase==="revealed"?`🎉 ${esc(dr.spin)} 🎉`:esc(dr.spin||"...")}</div></div>
    ${dr.winners.length ? `<div class="box"><h3>이전 당첨자 (제외)</h3><div class="chips">${dr.winners.map((w,i)=>`<span class="chip won">${medal(i)} ${esc(w.name)}</span>`).join("")}</div></div>` : ""}
    ${dr.phase==="ready" ? `<div class="sub" style="margin-top:10px;font-size:13px">남은 후보 ${remaining.length}명</div><button class="gold" onclick="drSpin()">🎲 ${dr.round+1}등 뽑기</button>` : ""}
    ${dr.phase==="spinning" ? `<div class="ghost" style="text-align:center">추첨 중...</div>` : ""}
    ${dr.phase==="revealed" ? `<button class="gold" onclick="drNext()">${dr.round < dr.prizes.length-1 ? `다음 → ${dr.round+2}등 추첨` : "🏆 최종 결과 보기"}</button>` : ""}`;
  }
  box.innerHTML = `<div class="draw" id="drawRoot"><div style="text-align:center;font-size:40px">⛳</div><h2>골프 상품 추첨</h2><div class="sub">${dr.phase==="setup"?`Lucky Draw · ${pool.length} → ${dr.prizes.length}`:dr.phase==="finished"?"All Winners":`Round ${dr.round+1} of ${dr.prizes.length}`}</div>${body}</div>`;
}
function drToggle(n) { dr.excluded = dr.excluded.includes(n) ? dr.excluded.filter((x)=>x!==n) : [...dr.excluded, n]; renderDraw(); }
function drAddExtra() { const v = $("drExtra").value.trim(); if (!v) return; if (!dr.extra.includes(v)) dr.extra.push(v); renderDraw(); }
function drAddPrize() { if (dr.prizes.length < 10) { dr.prizes.push(`${dr.prizes.length+1}등 상품`); renderDraw(); } }
function drRemovePrize(i) { if (dr.prizes.length > 1) { dr.prizes.splice(i,1); renderDraw(); } }
function drBegin() { dr.prizes = dr.prizes.map((p,i)=>p.trim()||`${i+1}등 상품`); dr.round = 0; dr.winners = []; dr.spin = ""; dr.phase = "ready"; renderDraw(); }
function drSpin() {
  const remaining = drawPool().filter((n) => !dr.winners.some((w) => w.name===n)); if (!remaining.length) return;
  dr.phase = "spinning"; renderDraw();
  const winner = remaining[Math.floor(Math.random()*remaining.length)], duration = 2800, t0 = Date.now();
  const tick = () => {
    const el = Date.now()-t0;
    if (el >= duration) { dr.spin = winner; dr.winners.push({ name: winner, prize: dr.prizes[dr.round] }); dr.phase = "revealed"; renderDraw(); confettiBurst(); return; }
    const p = el/duration; const n = $("drName"); if (n) n.textContent = remaining[Math.floor(Math.random()*remaining.length)];
    setTimeout(tick, 60 + p*p*250);
  };
  tick();
}
function drNext() { if (dr.round >= dr.prizes.length-1) dr.phase = "finished"; else { dr.round++; dr.spin = ""; dr.phase = "ready"; } renderDraw(); }
function drReset() { dr = { phase:"setup", prizes:["1등 상품","2등 상품","3등 상품"], excluded:[], extra:[], round:0, winners:[], spin:"" }; renderDraw(); }
async function drSave() {
  try { await rpc("admin_save_draw", { ...auth(), p_event_id: selectedId, p_results: dr.winners }); toast("추첨 결과를 저장했어요"); await loadAll(); drReset(); } catch (e) { toast(e.message); }
}
function confettiBurst() {
  const root = $("drawRoot"); if (!root) return;
  const cols = ["#FFD700","#FF6B6B","#4ECDC4","#95E1D3","#FFA07A","#fbbf24"];
  for (let k=0;k<35;k++) { const d = document.createElement("div"); d.className = "conf"; d.style.cssText = `left:${20+Math.random()*60}%;background:${cols[k%6]};animation-duration:${1.8+Math.random()*1.2}s;animation-delay:${Math.random()*.4}s;transform:rotate(${Math.random()*360}deg)`; root.appendChild(d); setTimeout(()=>d.remove(), 4000); }
}

/* ---------- 네이버 지도 ---------- */
function drawMap(lat, lng, editable, title) {
  const init = () => {
    const pos = new naver.maps.LatLng(lat, lng);
    naverMap = new naver.maps.Map("map", { center: pos, zoom: 16 });
    naverMarker = new naver.maps.Marker({ position: pos, map: naverMap, title: title || "" });
    if (editable) naver.maps.Event.addListener(naverMap, "click", (e) => { naverMarker.setPosition(e.coord); $("cLat").value = e.coord.lat(); $("cLng").value = e.coord.lng(); });
  };
  if (window.naver?.maps) return init();
  const s = document.createElement("script"); s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_MAP_CLIENT_ID}`; s.onload = init; document.head.appendChild(s);
}

/* ---------- 시작 ---------- */
(async () => {
  if (SUPABASE_URL.includes("YOUR-PROJECT")) { document.querySelector("main").innerHTML = `<div class="empty">index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 를 먼저 채워 주세요. (README 참고)</div>`; return; }
  await loadAll();
  if (me) { try { await rpc("login", { p_name: me.name, p_pin: me.pin }); } catch { me = null; localStorage.removeItem("pga:me"); } }
  render();
})();
</script>
