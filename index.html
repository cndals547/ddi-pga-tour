<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGA 투어 골프동호회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 여기 두 줄만 채우면 됩니다 (README 참고) ===== */
const SUPABASE_URL = "https://unrssizgfajkwmebwyrc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l5igvMDALOb_Nx66xEAyjw_NXqCaeau";
/* 네이버 지도 Client ID (선택) — 비워두면 지도 대신 '네이버 지도 열기' 링크만 보입니다 */
const NAVER_MAP_CLIENT_ID = "8zxqqehg8e";

const ADMIN_NAMES_HINT = "원종길, 이충민";
const GROUP_SIZE = 2;
const DEFAULT_PLACE = "골프존파크 창신동묘역점";
const DEFAULT_ADDR = "서울 종로구 지봉로 19 12층";
const DEFAULT_LINK = "https://naver.me/xzxmP1oQ";
const SITE_URL = "https://ddi-pga-tour.netlify.app";
// 기본 좌표(대략). 모임 만들 때 지도 클릭으로 정확히 맞출 수 있습니다.
const DEFAULT_LAT = 37.5742, DEFAULT_LNG = 127.0123;
</script>
<style>
  :root { --green:#1E5A3C; --green-deep:#123E29; --sand:#F3EFE2; --ink:#1A1F1C; --line:#D9D3C0; --flag:#C8412B; --muted:#8A8677; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--sand); color:var(--ink); font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:15px; }
  header { background:var(--green); color:#fff; padding:22px 20px 0; }
  .wrap { max-width:760px; margin:0 auto; }
  header .top { display:flex; justify-content:space-between; align-items:flex-end; }
  header small { opacity:.8; font-size:13px; }
  header h1 { margin:4px 0 0; font-size:28px; letter-spacing:-.02em; }
  header .me { text-align:right; font-size:13px; }
  header .me button { background:none; border:0; color:#fff; opacity:.7; text-decoration:underline; font-size:12px; cursor:pointer; padding:0; }
  .badge { font-size:11px; background:rgba(255,255,255,.2); padding:2px 6px; border-radius:4px; margin-left:4px; }
  nav { display:flex; gap:4px; margin-top:18px; }
  nav button { background:transparent; border:0; color:rgba(255,255,255,.75); padding:9px 16px; border-radius:10px 10px 0 0; font-size:14px; font-weight:500; cursor:pointer; }
  nav button.on { background:var(--sand); color:var(--green-deep); }
  main { padding:24px 20px 60px; }
  section { display:none; } section.on { display:block; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .hero { background:var(--green-deep); color:#fff; border:0; }
  .hero a { color:#fff; opacity:.9; }
  .hero .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .hero .big { font-size:40px; font-weight:700; line-height:1; text-align:right; }
  .hero .big small { display:block; font-size:12px; opacity:.75; font-weight:400; margin-top:4px; }
  .hero .date { font-size:24px; font-weight:700; margin:4px 0 12px; }
  h2 { font-size:20px; margin:0 0 4px; } h3 { font-size:17px; margin:0 0 4px; }
  p.sub { margin:0 0 14px; font-size:14px; opacity:.7; }
  label { display:block; font-size:13px; opacity:.7; margin-bottom:4px; }
  .inp { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:15px; font-family:inherit; }
  .inp:focus { outline:2px solid var(--green); outline-offset:1px; }
  .inp:disabled { opacity:.4; }
  .grid { display:grid; gap:12px; }
  @media (min-width:600px) { .g3 { grid-template-columns:1fr 1fr 1fr; } .g2 { grid-template-columns:1fr 1fr; } }
  .btn { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
  .btn.p { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.l { background:rgba(255,255,255,.15); color:#fff; border-color:transparent; }
  .btn.full { width:100%; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .toggle { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button { flex:1; padding:9px; border:0; background:#fff; cursor:pointer; font-size:14px; font-family:inherit; }
  .toggle button.yes.on { background:var(--green); color:#fff; }
  .toggle button.no.on { background:var(--flag); color:#fff; }
  .err { color:var(--flag); font-size:14px; }
  .mine { font-size:14px; font-weight:500; }
  .groups { display:grid; gap:12px; } @media (min-width:600px){ .groups { grid-template-columns:1fr 1fr; } }
  .group { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .group .h { background:var(--green); color:#fff; padding:8px 14px; font-size:14px; font-weight:700; display:flex; justify-content:space-between; }
  .group .h span:last-child { font-weight:400; opacity:.8; }
  .group ul, .st ul, .mlist { list-style:none; margin:0; padding:0; }
  .group li { display:flex; justify-content:space-between; padding:8px 14px; font-size:14px; border-top:1px solid var(--line); }
  .group li.empty { opacity:.3; border-top-style:dashed; }
  .st { display:grid; gap:12px; margin-top:18px; } @media (min-width:600px){ .st { grid-template-columns:1fr 1fr 1fr; } }
  .st .card { margin:0; padding:14px; } .st .t { font-weight:700; font-size:14px; margin-bottom:8px; }
  .st li { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  .x { background:none; border:0; opacity:.35; cursor:pointer; font-size:16px; line-height:1; } .x:hover { opacity:1; }
  .empty { border:1px dashed var(--line); border-radius:14px; padding:24px; text-align:center; font-size:14px; opacity:.7; }
  .mlist li { display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:14px; border-top:1px solid var(--line); }
  .mlist li:first-child { border-top:0; } .mlist .n { flex:1; font-weight:500; }
  .mlist .inp { width:90px; text-align:center; } .mlist input.short { width:70px; }
  .hist li { display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:8px; list-style:none; }
  .hist li a { color:inherit; text-decoration:none; cursor:pointer; } .hist small { display:block; opacity:.7; }
  #map { width:100%; height:260px; border-radius:10px; margin-top:12px; background:#e8e4d6; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green-deep); color:#fff; padding:9px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.on { opacity:1; }
  .sec-h { display:flex; justify-content:space-between; align-items:baseline; margin:24px 0 10px; }
  .sec-h small { opacity:.7; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><small>두산 디지털이노베이션BU 골프동호회</small><h1>PGA 투어</h1></div>
    <div class="me" id="meBox"></div>
  </div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap">
  <section id="s-login"></section>
  <section id="s-event"></section>
  <section id="s-history"></section>
  <section id="s-members"></section>
</main>
<div id="toast"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let me = JSON.parse(localStorage.getItem("pga:me") || "null"); // {name, pin, is_admin}
let members = [], events = [], rsvps = [], selectedId = null, tab = "event", creating = false;
let naverMap = null, naverMarker = null;

const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); };
const fmtDate = (iso) => { const d = new Date(iso + "T00:00:00"); return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`; };
const monthOf = (iso) => `${new Date(iso + "T00:00:00").getMonth()+1}월`;
const isAdmin = () => !!me?.is_admin;

/* ---------- 데이터 ---------- */
async function loadAll() {
  const [m, e, r] = await Promise.all([
    sb.from("members").select("name,position,is_admin,sort_order").order("sort_order"),
    sb.from("events").select("*").order("event_date", { ascending: false }),
    sb.from("rsvps").select("*"),
  ]);
  if (m.error || e.error || r.error) { toast("불러오기 실패: " + (m.error || e.error || r.error).message); return; }
  members = m.data; events = e.data; rsvps = r.data;
  if (!events.find((x) => x.id === selectedId)) selectedId = events[0]?.id ?? null;
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message.replace(/^.*?: /, ""));
  return data;
}
const auth = () => ({ p_name: me.name, p_pin: me.pin });

/* ---------- 렌더 ---------- */
function render() {
  $("meBox").innerHTML = me ? `<div>${esc(me.name)}${isAdmin() ? '<span class="badge">관리자</span>' : ""}</div><button onclick="logout()">다른 이름으로 접속</button>` : "";
  const tabs = me ? (isAdmin() ? [["event","이번 모임"],["history","지난 모임"],["members","회원 관리"]] : [["event","이번 모임"],["history","지난 모임"]]) : [];
  $("nav").innerHTML = tabs.map(([k,l]) => `<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  ["login","event","history","members"].forEach((k) => $("s-"+k).classList.toggle("on", me ? tab===k : k==="login"));
  if (!me) renderLogin(); else if (tab==="event") renderEvent(); else if (tab==="history") renderHistory(); else renderMembers();
}
function go(k) { tab = k; creating = false; render(); }
function logout() { me = null; localStorage.removeItem("pga:me"); tab = "event"; render(); }

function renderLogin() {
  $("s-login").innerHTML = `
  <div style="max-width:380px;margin:24px auto">
    <h2>접속</h2><p class="sub">이름을 선택하고 휴대폰 번호 뒷자리 4자리를 입력하세요. 이 기기에 기억됩니다.</p>
    <div class="grid">
      <div><label>이름</label><select class="inp" id="lgName"><option value="">선택</option>${members.map((m)=>`<option value="${esc(m.name)}">${esc(m.name)}${m.is_admin?" (관리자)":""}</option>`).join("")}</select></div>
      <div><label>휴대폰 뒷자리 4자리</label><input class="inp" id="lgPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="err" id="lgErr"></div>
      <button class="btn p full" onclick="doLogin()">들어가기</button>
    </div>
  </div>`;
  $("lgPin").addEventListener("keydown", (e) => e.key==="Enter" && doLogin());
}
async function doLogin() {
  const name = $("lgName").value, pin = $("lgPin").value.replace(/\D/g,"");
  if (!name) return $("lgErr").textContent = "이름을 선택해 주세요";
  if (pin.length !== 4) return $("lgErr").textContent = "뒷자리 4자리를 입력해 주세요";
  try {
    const r = await rpc("login", { p_name: name, p_pin: pin });
    me = { name: r.name, pin, is_admin: r.is_admin };
    localStorage.setItem("pga:me", JSON.stringify(me));
    render();
  } catch (e) { $("lgErr").textContent = e.message; }
}

function groupsOf(evId) {
  const yes = rsvps.filter((r) => r.event_id===evId && r.status==="yes").sort((a,b)=>(a.leave_time||"").localeCompare(b.leave_time||""));
  const g = []; for (let i=0;i<yes.length;i+=GROUP_SIZE) g.push(yes.slice(i,i+GROUP_SIZE)); return g;
}
function announcement(ev) {
  return `안녕하세요, PGA 투어 동호회 입니다.

이번 달 동호회 활동은 ${fmtDate(ev.event_date)}에 진행합니다.

참석 여부는 메일 회신 대신 아래 동호회 페이지에서 직접 등록해 주세요.
▶ ${SITE_URL}
  1) 이름 선택 → 휴대폰 뒷자리 4자리 입력
  2) 참석/불참 선택 + 퇴근 시간 입력 → 등록
  (퇴근 시간은 조 편성에 참고합니다. 조 편성 결과도 같은 페이지에서 확인됩니다.)

장소 : ${ev.place} (${ev.address})
${ev.link}

감사합니다.`;
}
async function copy(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch { toast("복사에 실패했어요"); } }

function renderEvent() {
  const ev = events.find((e) => e.id===selectedId);
  const box = $("s-event");
  if (!ev && !isAdmin()) { box.innerHTML = `<div class="empty">아직 이번 달 모임이 열리지 않았어요. 관리자(${ADMIN_NAMES_HINT})가 모임을 만들면 여기서 참석 등록을 할 수 있습니다.</div>`; return; }
  if (creating || !ev) {
    box.innerHTML = `
    <h2>${events.length ? "새 모임 만들기" : "첫 모임을 만들어 보세요"}</h2><p class="sub">날짜와 장소를 정하면 참석 접수가 바로 시작됩니다.</p>
    <div class="grid">
      <div><label>날짜</label><input class="inp" type="date" id="cDate"></div>
      <div><label>장소</label><input class="inp" id="cPlace" value="${esc(DEFAULT_PLACE)}"></div>
      <div><label>주소</label><input class="inp" id="cAddr" value="${esc(DEFAULT_ADDR)}"></div>
      <div><label>네이버 지도 링크</label><input class="inp" id="cLink" value="${esc(DEFAULT_LINK)}"></div>
      ${NAVER_MAP_CLIENT_ID ? `<div><label>지도에서 위치 클릭해서 맞추기</label><div id="map"></div></div>` : ""}
      <input type="hidden" id="cLat" value="${DEFAULT_LAT}"><input type="hidden" id="cLng" value="${DEFAULT_LNG}">
    </div>
    <div class="btns"><button class="btn p" onclick="createMeeting()">모임 만들기</button>${events.length ? `<button class="btn" onclick="creating=false;render()">취소</button>` : ""}</div>`;
    if (NAVER_MAP_CLIENT_ID) drawMap(DEFAULT_LAT, DEFAULT_LNG, true);
    return;
  }
  const my = rsvps.find((r) => r.event_id===ev.id && r.name===me.name);
  const yes = rsvps.filter((r)=>r.event_id===ev.id && r.status==="yes"), no = rsvps.filter((r)=>r.event_id===ev.id && r.status==="no");
  const pending = members.map((m)=>m.name).filter((n)=>!rsvps.some((r)=>r.event_id===ev.id && r.name===n));
  const groups = groupsOf(ev.id);
  box.innerHTML = `
  <div class="card hero">
    <div class="row">
      <div><small style="opacity:.75">${monthOf(ev.event_date)} 정기 모임</small><div class="date">${fmtDate(ev.event_date)}</div>
        <div style="font-size:14px">${esc(ev.place)}<br><span style="opacity:.75">${esc(ev.address)}</span><br>${ev.link ? `<a href="${esc(ev.link)}" target="_blank" rel="noreferrer">네이버 지도 열기</a>` : ""}</div></div>
      <div class="big">${yes.length}<small>참석</small></div>
    </div>
    ${NAVER_MAP_CLIENT_ID && ev.lat ? `<div id="map"></div>` : ""}
    ${isAdmin() ? `<div class="btns"><button class="btn l" onclick="copyAnn()">안내 메일 복사</button><button class="btn l" onclick="creating=true;render()">새 모임 만들기</button></div>` : ""}
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px"><h3>${esc(me.name)}님, 이번 모임 참석하시나요?</h3>
      ${my ? `<span class="mine" style="color:${my.status==="yes"?"var(--green)":"var(--flag)"}">${my.status==="yes"?`참석 등록됨 · ${esc(my.leave_time)} 퇴근`:"불참 등록됨"}</span>` : ""}</div>
    <p class="sub">퇴근 시간은 조 편성에 쓰입니다. 다시 등록하면 이전 내용을 덮어씁니다.</p>
    <div class="grid g3">
      <div><label>퇴근 시간</label><input class="inp" type="time" id="rLeave" value="${esc(my?.leave_time || "17:30")}" ${my?.status==="no"?"disabled":""}></div>
      <div><label>참석</label><div class="toggle"><button class="yes ${(my?.status||"yes")==="yes"?"on":""}" onclick="setStatus('yes')">참석</button><button class="no ${my?.status==="no"?"on":""}" onclick="setStatus('no')">불참</button></div></div>
      <div style="display:flex;align-items:flex-end"><button class="btn p full" onclick="submitRsvp()">${my?"수정":"등록"}</button></div>
    </div>
  </div>
  <div class="sec-h"><h3>조 편성</h3><small>퇴근 시간이 가까운 순으로 ${GROUP_SIZE}명씩 자동 편성</small></div>
  ${groups.length ? `<div class="groups">${groups.map((g,i)=>`<div class="group"><div class="h"><span>${i+1}조</span><span>${esc(g[0].leave_time)} ~ ${esc(g[g.length-1].leave_time)} 퇴근</span></div><ul>
    ${g.map((r)=>`<li><span>${esc(r.name)}</span><span style="opacity:.7">${esc(r.leave_time)} 퇴근</span></li>`).join("")}
    ${Array.from({length:GROUP_SIZE-g.length}).map(()=>`<li class="empty">빈 자리</li>`).join("")}</ul></div>`).join("")}</div>`
   : `<div class="empty">아직 참석자가 없어요. 위에서 참석을 등록하면 조가 자동으로 만들어집니다.</div>`}
  <div class="st">
    <div class="card"><div class="t" style="color:var(--green)">참석 ${yes.length}</div><ul>${yes.map((r)=>`<li><span>${esc(r.name)} · ${esc(r.leave_time)}</span>${isAdmin()?`<button class="x" onclick="delRsvp('${esc(r.name)}')">×</button>`:""}</li>`).join("")||'<li style="opacity:.4">없음</li>'}</ul></div>
    <div class="card"><div class="t" style="color:var(--flag)">불참 ${no.length}</div><ul>${no.map((r)=>`<li><span>${esc(r.name)}</span>${isAdmin()?`<button class="x" onclick="delRsvp('${esc(r.name)}')">×</button>`:""}</li>`).join("")||'<li style="opacity:.4">없음</li>'}</ul></div>
    <div class="card"><div class="t" style="color:var(--muted)">미회신 ${pending.length}</div><ul>${pending.map((n)=>`<li><span>${esc(n)}</span></li>`).join("")||'<li style="opacity:.4">없음</li>'}</ul></div>
  </div>
  ${isAdmin() && pending.length ? `<div class="btns"><button class="btn" onclick="copyRemind()">미회신자 리마인드 문구 복사</button></div>` : ""}`;
  window._status = my?.status || "yes";
  if (NAVER_MAP_CLIENT_ID && ev.lat) drawMap(ev.lat, ev.lng, false, ev.place);
}
function setStatus(s) { window._status = s; $("rLeave").disabled = s==="no"; document.querySelectorAll(".toggle button").forEach((b)=>b.classList.toggle("on", b.classList.contains(s))); }
async function submitRsvp() {
  try { await rpc("upsert_rsvp", { ...auth(), p_event_id: selectedId, p_status: window._status, p_leave: window._status==="yes" ? $("rLeave").value : null });
    toast(window._status==="yes" ? "참석 등록했어요" : "불참 등록했어요"); await loadAll(); render(); } catch (e) { toast(e.message); }
}
async function delRsvp(name) { try { await rpc("admin_delete_rsvp", { ...auth(), p_event_id: selectedId, p_target: name }); await loadAll(); render(); } catch (e) { toast(e.message); } }
async function createMeeting() {
  if (!$("cDate").value) return toast("날짜를 입력해 주세요");
  try { selectedId = await rpc("admin_create_event", { ...auth(), p_date: $("cDate").value, p_place: $("cPlace").value, p_address: $("cAddr").value, p_link: $("cLink").value, p_lat: +$("cLat").value, p_lng: +$("cLng").value });
    creating = false; toast("모임을 만들었어요"); await loadAll(); render(); } catch (e) { toast(e.message); }
}
function copyAnn() { copy(announcement(events.find((e)=>e.id===selectedId)), "안내 메일 문구를 복사했어요"); }
function copyRemind() { const ev = events.find((e)=>e.id===selectedId); const p = members.map((m)=>m.name).filter((n)=>!rsvps.some((r)=>r.event_id===ev.id && r.name===n)); copy(`아직 참석 등록 안 하신 분: ${p.join(", ")}\n${SITE_URL} 에서 참석 여부와 퇴근 시간 등록 부탁드립니다!`, "리마인드 문구를 복사했어요"); }

function renderHistory() {
  $("s-history").innerHTML = events.length ? `<ul class="hist" style="padding:0;margin:0">${events.map((e)=>{ const c = rsvps.filter((r)=>r.event_id===e.id && r.status==="yes").length;
    return `<li><a onclick="selectedId=${e.id};go('event')"><b>${fmtDate(e.event_date)}</b><small>${esc(e.place)} · 참석 ${c}명 · ${Math.ceil(c/GROUP_SIZE)}개 조</small></a>${isAdmin()?`<button class="btn" onclick="delEvent(${e.id})">삭제</button>`:""}</li>`; }).join("")}</ul>`
    : `<div class="empty">아직 만든 모임이 없어요.</div>`;
}
async function delEvent(id) { if (!confirm("이 모임을 삭제할까요? 참석 기록도 함께 지워집니다.")) return; try { await rpc("admin_delete_event", { ...auth(), p_event_id: id }); await loadAll(); render(); } catch (e) { toast(e.message); } }

function renderMembers() {
  $("s-members").innerHTML = `
  <h2>회원 ${members.length}명</h2><p class="sub">각 회원의 휴대폰 뒷자리 4자리가 접속 비밀번호입니다. 보안상 화면에는 표시되지 않고, 새 번호를 넣고 저장하면 바뀝니다.</p>
  <div class="grid" style="grid-template-columns:1fr 90px 100px auto;margin-bottom:18px">
    <input class="inp" id="mName" placeholder="이름"><input class="inp" id="mPos" placeholder="직위"><input class="inp" id="mPin" inputmode="numeric" maxlength="4" placeholder="뒷자리 4"><button class="btn p" onclick="addMember()">추가</button>
  </div>
  <ul class="mlist card" style="padding:0">${members.map((m)=>`<li>
    <span class="n">${esc(m.name)} <span style="opacity:.6;font-weight:400">${esc(m.position||"")}</span>${m.is_admin?'<span class="badge" style="background:var(--green);color:#fff">관리자</span>':""}</span>
    <input class="inp short" inputmode="numeric" maxlength="4" placeholder="새 뒷자리" id="pin-${esc(m.name)}">
    <button class="btn" onclick="savePin('${esc(m.name)}','${esc(m.position||"")}',${m.is_admin})">저장</button>
    ${m.name!==me.name?`<button class="x" onclick="delMember('${esc(m.name)}')">×</button>`:""}
  </li>`).join("")}</ul>`;
}
async function addMember() {
  const n = $("mName").value.trim(), p = $("mPin").value.replace(/\D/g,"");
  if (!n) return toast("이름을 입력해 주세요"); if (p.length!==4) return toast("뒷자리 4자리를 입력해 주세요");
  try { await rpc("admin_upsert_member", { ...auth(), p_target: n, p_position: $("mPos").value.trim(), p_target_pin: p, p_is_admin: false }); toast(`${n} 등록`); await loadAll(); render(); } catch (e) { toast(e.message); }
}
async function savePin(n, pos, adm) {
  const p = $("pin-"+n).value.replace(/\D/g,""); if (p.length!==4) return toast("뒷자리 4자리를 입력해 주세요");
  try { await rpc("admin_upsert_member", { ...auth(), p_target: n, p_position: pos, p_target_pin: p, p_is_admin: adm }); if (n===me.name) { me.pin = p; localStorage.setItem("pga:me", JSON.stringify(me)); } toast(`${n} 뒷자리 변경`); } catch (e) { toast(e.message); }
}
async function delMember(n) { if (!confirm(`${n}님을 회원에서 삭제할까요?`)) return; try { await rpc("admin_delete_member", { ...auth(), p_target: n }); await loadAll(); render(); } catch (e) { toast(e.message); } }

/* ---------- 네이버 지도 ---------- */
function drawMap(lat, lng, editable, title) {
  const init = () => {
    const pos = new naver.maps.LatLng(lat, lng);
    naverMap = new naver.maps.Map("map", { center: pos, zoom: 16 });
    naverMarker = new naver.maps.Marker({ position: pos, map: naverMap, title: title || "" });
    if (editable) naver.maps.Event.addListener(naverMap, "click", (e) => { naverMarker.setPosition(e.coord); $("cLat").value = e.coord.lat(); $("cLng").value = e.coord.lng(); });
  };
  if (window.naver?.maps) return init();
  const s = document.createElement("script"); s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_MAP_CLIENT_ID}`; s.onload = init; document.head.appendChild(s);
}

/* ---------- 시작 ---------- */
(async () => {
  if (SUPABASE_URL.includes("YOUR-PROJECT")) { document.querySelector("main").innerHTML = `<div class="empty">index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 를 먼저 채워 주세요. (README 참고)</div>`; return; }
  await loadAll();
  if (me) { try { await rpc("login", { p_name: me.name, p_pin: me.pin }); } catch { me = null; localStorage.removeItem("pga:me"); } }
  render();
})();
</script>
</body>
